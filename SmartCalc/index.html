<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SmartCalc | Calculate Smarter</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="calculator">

    <div class="calculator-header">
        <h1>Smart<span>Calc</span></h1>
        <p>Calculate Smarter. Get Results Faster.</p>
    </div>

    <div class="display">
        <div id="previousOperand"></div>
        <div id="currentOperand">0</div>
    </div>

    <div class="history-section">


<div class="history-header">
    <h3>Calculation History</h3>
    <button id="clearHistory">Clear</button>
</div>

<ul id="historyList">
    <li class="empty-history">No calculations yet</li>
</ul>


</div>


    <div class="buttons">

        <button class="special" data-action="clear">AC</button>
        <button class="special" data-action="delete">DEL</button>
        <button class="operator" data-action="percent">%</button>
        <button class="operator" data-operator="÷">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="×">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="-">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+">+</button>

        <button data-action="sign">+/-</button>
        <button data-number="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equal" data-action="calculate">=</button>

    </div>

    <p class="calculator-footer">
        Designed with ♥ for everyday calculations
    </p>

</div>

<script src="script.js"></script>


</body>
</html>
