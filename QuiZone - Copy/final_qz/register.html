<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | QuiZone</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/quizone-logo.png">

    <style>
        .auth-container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-card p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .auth-card input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-card button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6c4ce4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-card button:hover {
            background: #5235c4;
        }

        .auth-card .login-link {
            margin-top: 20px;
            margin-bottom: 0;
        }

        .auth-card a {
            color: #6c4ce4;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="css/app-theme.css">

</head>

<body>

<header class="site-header">
    <nav class="site-navbar">
        <a href="index.html" class="brand-logo" aria-label="QuiZone home">
            <img src="images/quizone-logo.png" alt="QuiZone">
        </a>
        <div class="site-nav-links">
            <a href="index.html">Home</a>
            <a href="quizzes.html">Explore Quizzes</a>
            <a href="create-quiz.html">Create Quiz</a>
            <a href="progress.html">My Progress</a>
        </div>
    </nav>
</header>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>
            <p>Join QuiZone and start your quiz journey!</p>

            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Create Password"
                    required
                    minlength="8"
                >

                <button type="submit">Create Account</button>

            </form>

            <p id="message"></p>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
